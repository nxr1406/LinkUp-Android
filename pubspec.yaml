name: linkup
description: LinkUp - A modern messaging app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.19.3'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.4
  cloud_firestore: ^4.15.5
  firebase_storage: ^11.6.9
  firebase_messaging: ^14.7.0
  dart_jsonwebtoken: ^2.8.0

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^13.2.0

  # UI
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  timeago: ^3.6.1
  emoji_picker_flutter: ^2.1.1

  # Utils
  intl: ^0.19.0
  http: ^1.2.1
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^17.1.2
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.2

flutter:
  uses-material-design: true

  assets:
    - assets/splash.png
    - assets/ic_launcher.png

flutter_icons:
  android: true
  ios: false
  image_path: "assets/ic_launcher.png"

flutter_native_splash:
  color: "#ffffff"
  image: assets/splash.png
  android: true
  ios: false