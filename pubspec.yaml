name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build ARMv7 + ARM64 APK
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2️⃣ Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3️⃣ Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      # 4️⃣ Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # 5️⃣ Generate App Icon (Android only)
      - name: Generate App Icon
        run: flutter pub run flutter_launcher_icons

      # 6️⃣ Generate Splash Screen (Android only)
      - name: Generate Splash Screen
        run: flutter pub run flutter_native_splash:create

      # 7️⃣ Build Split APK (ARMv7 + ARM64)
      - name: Build Split APK
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64

      # 8️⃣ Upload APKs as GitHub Artifact
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: linkup-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30