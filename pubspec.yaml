name: linkup
description: A real-time chat application by NXR Dev.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # Image
  image_picker: ^1.1.2
  image: ^4.2.0

  # UI / UX
  cached_network_image: ^3.4.1
  timeago: ^3.7.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.3

  # WebView for Privacy Policy HTML
  flutter_inappwebview: ^6.1.5

  # Notifications
  flutter_local_notifications: ^17.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/ic_launcher.png"

flutter_native_splash:
  color: "#ffffff"
  image: assets/splash.png
  android: true
  ios: false

flutter:
  uses-material-design: true
  assets:
    - assets/