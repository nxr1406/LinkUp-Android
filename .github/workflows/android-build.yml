name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build ARMv7 + ARM64 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Generate App Icon
      - name: Generate App Icon
        run: flutter pub run flutter_launcher_icons:main

      # Generate Splash Screen
      - name: Generate Splash Screen
        run: flutter pub run flutter_native_splash:create

      # Build Split APK for ARMv7 + ARM64
      - name: Build Split APK
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64

      # Upload APKs as GitHub Artifact
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: linkup-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30