name: Build Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Release APK (Split ABI)
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js + Vite build ──────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Build Vite / React app
        run: npm run build

      # ── 3. Copy dist/ → flutter_app/assets/www/ ──────────────────────────────
      - name: Copy web build into Flutter assets
        run: |
          rm -rf flutter_app/assets/www
          mkdir -p flutter_app/assets/www
          cp -r dist/. flutter_app/assets/www/
          echo "✅ $(find flutter_app/assets/www -type f | wc -l) files copied"

      # ── 4. Java ──────────────────────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ── 5. Flutter ───────────────────────────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        working-directory: flutter_app
        run: flutter pub get

      # ── 6. Keystore — auto-generated every build ──────────────────────────────
      - name: Generate keystore
        working-directory: flutter_app/android
        run: |
          keytool -genkey -v \
            -keystore linkup-release.jks \
            -alias linkup \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=LinkUp, OU=Dev, O=LinkUp, L=Dhaka, ST=Dhaka, C=BD" \
            -storepass "linkup@2024" \
            -keypass "linkup@2024" \
            -noprompt

      - name: Write key.properties
        working-directory: flutter_app/android
        run: |
          cat > key.properties <<EOF
          storePassword=linkup@2024
          keyPassword=linkup@2024
          keyAlias=linkup
          storeFile=linkup-release.jks
          EOF

      # ── 7. Patch build.gradle for release signing ─────────────────────────────
      - name: Patch build.gradle
        working-directory: flutter_app/android/app
        run: |
          if grep -q "keystoreProperties" build.gradle; then
            echo "ℹ️  build.gradle already patched"
            exit 0
          fi

          # Prepend keystore loader
          sed -i '1s/^/def keystorePropertiesFile = rootProject.file("key.properties")\ndef keystoreProperties = new Properties()\nif (keystorePropertiesFile.exists()) { keystoreProperties.load(new FileInputStream(keystorePropertiesFile)) }\n\n/' build.gradle

          # Add signingConfigs inside android block
          sed -i '/^android {/a\    signingConfigs {\n        release {\n            keyAlias keystoreProperties["keyAlias"]\n            keyPassword keystoreProperties["keyPassword"]\n            storeFile file(keystoreProperties["storeFile"])\n            storePassword keystoreProperties["storePassword"]\n        }\n    }' build.gradle

          # Apply signingConfig to release buildType
          sed -i '/release {/a\            signingConfig signingConfigs.release' build.gradle

          echo "✅ build.gradle patched for release signing"

      # ── 8. Build split release APKs ───────────────────────────────────────────
      - name: Build release APKs (split per ABI)
        working-directory: flutter_app
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --target-platform android-arm,android-arm64,android-x64

          echo ""
          echo "📦 Output APKs:"
          find build/app/outputs/flutter-apk -name "*.apk" -exec sh -c 'echo "   $(du -h $1 | cut -f1)  $(basename $1)"' _ {} \;

      # ── 9. Rename APKs ────────────────────────────────────────────────────────
      - name: Rename APKs
        working-directory: flutter_app/build/app/outputs/flutter-apk
        run: |
          RUN="${{ github.run_number }}"
          [ -f "app-armeabi-v7a-release.apk" ] && mv "app-armeabi-v7a-release.apk" "LinkUp-v1.0.${RUN}-arm32.apk"
          [ -f "app-arm64-v8a-release.apk"   ] && mv "app-arm64-v8a-release.apk"   "LinkUp-v1.0.${RUN}-arm64.apk"
          [ -f "app-x86_64-release.apk"      ] && mv "app-x86_64-release.apk"      "LinkUp-v1.0.${RUN}-x86_64.apk"
          ls -lh *.apk

      # ── 10. Upload artifacts ──────────────────────────────────────────────────
      - name: Upload ARM-32 APK
        uses: actions/upload-artifact@v4
        with:
          name: LinkUp-arm32-v1.0.${{ github.run_number }}
          path: flutter_app/build/app/outputs/flutter-apk/LinkUp-v1.0.${{ github.run_number }}-arm32.apk
          retention-days: 30

      - name: Upload ARM-64 APK
        uses: actions/upload-artifact@v4
        with:
          name: LinkUp-arm64-v1.0.${{ github.run_number }}
          path: flutter_app/build/app/outputs/flutter-apk/LinkUp-v1.0.${{ github.run_number }}-arm64.apk
          retention-days: 30

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: LinkUp-x86_64-v1.0.${{ github.run_number }}
          path: flutter_app/build/app/outputs/flutter-apk/LinkUp-v1.0.${{ github.run_number }}-x86_64.apk
          retention-days: 30

      # ── 11. Summary ───────────────────────────────────────────────────────────
      - name: Build summary
        run: |
          echo "## ✅ LinkUp Release Build \`#${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | ABI | ফোনের ধরন |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-----|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| LinkUp-v1.0.${{ github.run_number }}-**arm32**.apk | armeabi-v7a | পুরোনো ফোন (32-bit) |" >> $GITHUB_STEP_SUMMARY
          echo "| LinkUp-v1.0.${{ github.run_number }}-**arm64**.apk | arm64-v8a | আধুনিক ফোন (64-bit) ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| LinkUp-v1.0.${{ github.run_number }}-**x86_64**.apk | x86_64 | Emulator |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Actions → এই run → **Artifacts** সেকশন থেকে ডাউনলোড করো।" >> $GITHUB_STEP_SUMMARY
