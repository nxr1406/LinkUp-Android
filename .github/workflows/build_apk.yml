name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Java (required by Android build)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3️⃣ Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # 4️⃣ Get Flutter dependencies
      - name: Get dependencies
        run: flutter pub get

      # 5️⃣ Decode Keystore from GitHub Secret
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
          chmod 600 android/app/keystore.jks

      # 6️⃣ Create key.properties
      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=app/keystore.jks" >> android/key.properties

      # 7️⃣ Build Split APKs
      - name: Build Split APKs
        run: |
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --split-per-abi

      # 8️⃣ Upload armeabi-v7a APK
      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-armeabi-v7a
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      # 9️⃣ Upload arm64-v8a APK
      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      # 1️⃣0️⃣ Upload universal APK (optional)
      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-universal
          path: build/app/outputs/flutter-apk/app-release.apk