name: Build Release APK (ARM-v7)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 21 ───────────────────────────────────────────────
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ── 3. Flutter ───────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      # ── 4. google-services.json from Secret ──────────────────────
      - name: Write google-services.json
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      # ── 5. Generate local.properties ─────────────────────────────
      - name: Generate local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          FLUTTER_PATH=$(which flutter)
          FLUTTER_SDK=$(dirname $(dirname $FLUTTER_PATH))
          echo "flutter.sdk=$FLUTTER_SDK" >> android/local.properties
          echo "flutter.buildMode=release" >> android/local.properties
          echo "flutter.versionName=1.0.0" >> android/local.properties
          echo "flutter.versionCode=1" >> android/local.properties

      # ── 6. Dependencies ──────────────────────────────────────────
      - name: Get Flutter dependencies
        run: flutter pub get

      # ── 6.1 Generate App Icons ───────────────────────────────────
      - name: Generate App Icons
        run: flutter pub run flutter_launcher_icons

      # ── 6.2 Generate Splash ──────────────────────────────────────
      - name: Generate Splash Screen
        run: flutter pub run flutter_native_splash:create

      # ── 7. Analyze ───────────────────────────────────────────────
      - name: Analyze (warnings only)
        run: flutter analyze --no-fatal-infos || true

      # ── 8. Build ARM-v7 release APK ──────────────────────────────
      - name: Build release APK (armeabi-v7a)
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm \
            --split-per-abi \
            --no-shrink

      # ── 9. Stage APK ─────────────────────────────────────────────
      - name: Stage APK
        run: |
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
             output/LinkUp-arm7-release.apk

      # ── 10. Upload artifact (every push) ─────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinkUp-arm7-release
          path: output/LinkUp-arm7-release.apk
          retention-days: 30

      # ── 11. GitHub Release (only on tag push) ────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/LinkUp-arm7-release.apk
          name: "LinkUp ${{ github.ref_name }}"
          body: |
            ## LinkUp ${{ github.ref_name }}
            ### Download
            **LinkUp-arm7-release.apk** — Android ARM 32-bit
            ### Requirements
            Android 5.0+ (API 21+)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}