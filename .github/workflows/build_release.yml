name: Build Release APK (ARM-v7)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java ───────────────────────────────────────────────────
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 3. Flutter ───────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      # ── 4. Firebase Config ───────────────────────────────────────
      - name: Write google-services.json
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      # ── 5. Keystore Decode ────────────────────────────────────────
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks

      # ── 6. Create keystore.properties ────────────────────────────
      - name: Create keystore.properties
        run: |
          echo "storeFile=android/app/keystore.jks" > android/keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/keystore.properties

      # ── 7. local.properties ───────────────────────────────────────
      - name: Generate local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          FLUTTER_PATH=$(which flutter)
          FLUTTER_SDK=$(dirname $(dirname $FLUTTER_PATH))
          echo "flutter.sdk=$FLUTTER_SDK" >> android/local.properties
          echo "flutter.buildMode=release" >> android/local.properties

      # ── 8. Dependencies ──────────────────────────────────────────
      - name: Get dependencies
        run: flutter pub get

      # ── 9. Generate Assets ───────────────────────────────────────
      - name: Generate App Icons
        run: flutter pub run flutter_launcher_icons

      - name: Generate Splash Screen
        run: flutter pub run flutter_native_splash:create

      # ── 10. Analyze ──────────────────────────────────────────────
      - name: Analyze project
        run: flutter analyze --no-fatal-infos || true

      # ── 11. Build Signed APK (ARM-v7) ───────────────────────────
      - name: Build release APK (armeabi-v7a)
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm \
            --split-per-abi \
            --no-shrink

      # ── 12. Stage APK ────────────────────────────────────────────
      - name: Prepare output
        run: |
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
             output/LinkUp-armv7-release.apk

      # ── 13. Upload Artifact ──────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinkUp-armv7-release
          path: output/LinkUp-armv7-release.apk
          retention-days: 30

      # ── 14. GitHub Release (only tags) ───────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/LinkUp-armv7-release.apk
          name: "LinkUp ${{ github.ref_name }}"
          body: |
            ## 🚀 LinkUp Release ${{ github.ref_name }}

            ### 📦 Download
            - LinkUp ARM-v7 Signed APK

            ### 📱 Requirements
            - Android 5.0+ (API 21+)

            ### 🔐 Signed Build
            - Keystore signing enabled
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}